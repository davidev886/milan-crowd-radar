name: Telegram brief

# The morning brief goes out when the 06:40 routine pushes data/briefing.json.
# GitHub's schedule can start hours late, so the morning cron entries are only a
# backup: they skip once today's data has landed.
# Schedules are in UTC. Each send is listed twice (summer and winter time); the
# script only sends from the entry that lands at the right hour in Milan.
on:
  push:
    branches: [main]
    paths: [data/briefing.json]
  schedule:
    - cron: "7 5 * * *"    # 07:07 Milan in summer (CEST) - morning backup
    - cron: "7 6 * * *"    # 07:07 Milan in winter (CET)  - morning backup
    - cron: "7 17 * * *"   # 19:07 Milan in summer - tomorrow preview
    - cron: "7 18 * * *"   # 19:07 Milan in winter - tomorrow preview
  workflow_dispatch:
    inputs:
      mode:
        description: "What to send"
        type: choice
        options: [morning, evening, find-chat-id, dry-run]
        default: morning

permissions:
  contents: read

concurrency:
  group: telegram-brief
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # The runner's own python3 is enough: the script uses only the standard library.
      - name: Send brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "${DASHBOARD_URL}" ]; then unset DASHBOARD_URL; fi
          if [ "$EVENT_NAME" = "push" ]; then
            python3 bot/send_brief.py --mode morning --after-push
          elif [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              "7 5 * * *")  python3 bot/send_brief.py --mode morning --target-local-hour 7  --scheduled-utc-hour 5 --unless-refreshed ;;
              "7 6 * * *")  python3 bot/send_brief.py --mode morning --target-local-hour 7  --scheduled-utc-hour 6 --unless-refreshed ;;
              "7 17 * * *") python3 bot/send_brief.py --mode evening --target-local-hour 19 --scheduled-utc-hour 17 ;;
              "7 18 * * *") python3 bot/send_brief.py --mode evening --target-local-hour 19 --scheduled-utc-hour 18 ;;
              *) echo "Unknown schedule: $SCHEDULE"; exit 1 ;;
            esac
          else
            case "$MANUAL_MODE" in
              dry-run) python3 bot/send_brief.py --mode morning --dry-run ;;
              *)       python3 bot/send_brief.py --mode "$MANUAL_MODE" ;;
            esac
          fi
